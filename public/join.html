<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyako Mediation — Join Interview</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: calc(100vh - 100px);
    }

    .call-panel {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
    }

    .call-video-container {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .call-video-container video.remote {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .call-video-container video.local {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 160px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .join-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .join-overlay h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .join-overlay p {
      color: #aaa;
      margin-bottom: 24px;
    }

    .call-controls {
      padding: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>親子間仲裁 <span>Oyako Mediation</span></h1>
    <span id="call-status" class="status-indicator">接続中 Connecting...</span>
  </header>

  <main>
    <div class="panel call-panel">
      <div class="call-video-container">
        <video id="remote-video" class="remote" autoplay playsinline></video>
        <video id="local-video" class="local" autoplay playsinline muted></video>
        <div id="join-overlay" class="join-overlay">
          <div>
            <h2>面談セッションに参加 Joining Interview Session</h2>
            <p>通話にはカメラとマイクを使用します Your camera and microphone will be used for the call.</p>
            <button id="btn-join" class="btn btn-primary" style="font-size:1rem;padding:10px 28px;">参加 Join Call</button>
          </div>
        </div>
      </div>
      <div class="call-controls">
        <button id="btn-mute" class="btn btn-secondary">ミュート Mute</button>
        <button id="btn-cam" class="btn btn-secondary">カメラオフ Camera Off</button>
        <button id="btn-leave" class="btn btn-danger">退出 Leave</button>
      </div>
    </div>
  </main>

  <footer>
    <div id="status-bar">
      <span id="connection-status" class="status-dot disconnected"></span>
      <span id="status-text">未接続 Not connected</span>
    </div>
  </footer>

  <script src="/join.js"></script>
</body>
</html>
